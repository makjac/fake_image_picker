name: fake_image_picker
description: >-
  A ready-to-use fake implementation of the Flutter image_picker plugin.
  Register it in your unit tests to get deterministic, random, or custom
  fake images and videos without writing manual mocks.
version: 1.0.0
homepage: https://github.com/makjac/fake_image_picker
repository: https://github.com/makjac/fake_image_picker
issue_tracker: https://github.com/makjac/fake_image_picker/issues

environment:
  sdk: ^3.10.0
  flutter: ">=3.10.0"

dependencies:
  cross_file: ^0.3.1+1
  flutter:
    sdk: flutter
  image_picker_platform_interface: ^2.11.0
  meta: ^1.12.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

topics:
  - image-picker
  - mock
  - testing
  - fake
